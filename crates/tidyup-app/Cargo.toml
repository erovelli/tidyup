[package]
name = "tidyup-app"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true
readme      = "README.md"
description = "Application services — the plug-and-play handles shared by CLI and UI."
# Internal to the tidyup workspace: no external consumers, and the layering
# rules in CLAUDE.md are the only contract it upholds. Marked explicitly so a
# `cargo publish --workspace` cannot push it to crates.io as a side effect of
# releasing something that is meant to be published.
publish     = false

[dependencies]
tidyup-domain   = { workspace = true }
tidyup-core     = { workspace = true }
tidyup-pipeline = { workspace = true }

async-trait = { workspace = true }
anyhow      = { workspace = true }
blake3      = { workspace = true }
chrono      = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
tokio       = { workspace = true }
toml        = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
dirs        = { workspace = true }
walkdir     = { workspace = true }

[dev-dependencies]
tempfile              = { workspace = true }
tidyup-storage-sqlite = { workspace = true }
serde_json            = { workspace = true }
async-trait           = { workspace = true }

[lints]
workspace = true
