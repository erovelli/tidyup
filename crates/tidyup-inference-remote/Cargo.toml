[package]
name = "tidyup-inference-remote"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true
readme      = "README.md"
description = "Remote/HTTP inference backends: OpenAI-compatible, Anthropic, Ollama."
# Internal to the tidyup workspace: no external consumers, and the layering
# rules in CLAUDE.md are the only contract it upholds. Marked explicitly so a
# `cargo publish --workspace` cannot push it to crates.io as a side effect of
# releasing something that is meant to be published.
publish     = false

[dependencies]
tidyup-core = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
reqwest     = { workspace = true }
tokio       = { workspace = true }

[lints]
workspace = true
