[package]
name = "tidyup-core"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true
readme      = "README.md"
description = "Port traits (hexagonal architecture). All implementations depend on this crate."
# Internal to the tidyup workspace: no external consumers, and the layering
# rules in CLAUDE.md are the only contract it upholds. Marked explicitly so a
# `cargo publish --workspace` cannot push it to crates.io as a side effect of
# releasing something that is meant to be published.
publish     = false

[dependencies]
tidyup-domain = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
uuid          = { workspace = true }

[lints]
workspace = true
