[package]
name = "tidyup-storage-sqlite"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true
readme      = "README.md"
description = "Default storage backend: rusqlite-backed FileIndex, ChangeLog, BackupStore."
# Internal to the tidyup workspace: no external consumers, and the layering
# rules in CLAUDE.md are the only contract it upholds. Marked explicitly so a
# `cargo publish --workspace` cannot push it to crates.io as a side effect of
# releasing something that is meant to be published.
publish     = false

[dependencies]
tidyup-core   = { workspace = true }
tidyup-domain = { workspace = true }
async-trait   = { workspace = true }
anyhow        = { workspace = true }
rusqlite      = { workspace = true }
tokio         = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
serde_json    = { workspace = true }
walkdir       = { workspace = true }
blake3        = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt"] }
rusqlite      = { workspace = true }

[lints]
workspace = true
