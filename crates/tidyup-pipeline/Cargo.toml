[package]
name = "tidyup-pipeline"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
rust-version.workspace = true
readme      = "README.md"
description = "Classification pipelines: scan-mode (taxonomy) and migration-mode (target-aware)."
# Internal to the tidyup workspace: no external consumers, and the layering
# rules in CLAUDE.md are the only contract it upholds. Marked explicitly so a
# `cargo publish --workspace` cannot push it to crates.io as a side effect of
# releasing something that is meant to be published.
publish     = false

[dependencies]
tidyup-core   = { workspace = true }
tidyup-domain = { workspace = true }
tidyup-extract = { workspace = true }
async-trait   = { workspace = true }
anyhow        = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
walkdir       = { workspace = true }
blake3        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
infer         = { workspace = true }
mime_guess    = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
tidyup-storage-sqlite = { workspace = true }
# Multimodal tests author tiny PNGs to exercise image-modality routing.
image         = { workspace = true }

[lints]
workspace = true
