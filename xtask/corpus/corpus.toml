# Golden evaluation corpus for tidyup's classification cascade.
#
# Each entry pins a fixture file to the taxonomy folder it *should* land in.
#
#   file     — path relative to `xtask/corpus/`.
#   expected — taxonomy leaf the cascade should route the file to (trailing '/').
#              Temporal categories may append a year subdirectory at runtime
#              (e.g. "Finance/Taxes/2023/"); the harness treats that as correct.
# Every entry is evaluated by the same semantic classifier. File suffixes are
# part of the fixture names but do not select a destination.

# ── Cross-format semantic fixtures ──────────────────────────────────────────

[[entry]]
file = "files/main.rs"
expected = "Code/"

[[entry]]
file = "files/server.py"
expected = "Code/"

[[entry]]
file = "files/settings.toml"
expected = "Code/Config/"

[[entry]]
file = "files/Dockerfile"
expected = "Code/Config/"

[[entry]]
file = "files/Makefile"
expected = "Code/Config/"

[[entry]]
file = "files/data.csv"
expected = "Spreadsheets/"

[[entry]]
file = "files/budget.xlsx"
expected = "Spreadsheets/"

[[entry]]
file = "files/archive.zip"
expected = "Archives/"

[[entry]]
file = "files/Inter.ttf"
expected = "Fonts/"

[[entry]]
file = "files/holiday.jpg"
expected = "Photos/"

[[entry]]
file = "files/Screenshot_2024-01-02.png"
