# ── Tier 2 expansion (WP-4): more content-dependent samples per label so the
#    golden eval's per-label metrics rest on more than one or two files.
#    NOTE: `cargo xtask eval` is a developer + calibration tool (see eval.rs) —
#    its accuracy is REPORTED (and uploaded as a nightly artifact), not gated,
#    because the thresholds are uncalibrated pre-alpha. The falsifiable Tier-2
#    regression GATE is `eval-routing` over a real held-out corpus (20NG),
#    which fails the nightly lane when content stops beating the filename
#    baseline. These fixtures widen coverage; they are not themselves a gate.
#    Target ≥10 per content-dependent label; this batch brings each to ~4.

